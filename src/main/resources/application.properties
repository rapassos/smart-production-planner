spring.application.name=smart_production_planner

# Configuração do Datasource (PostgreSQL Docker)
spring.datasource.url=jdbc:postgresql://localhost:5432/smart_production_planner
spring.datasource.username=rafael_planner
spring.datasource.password=planner_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# Usamos 'validate' porque quem manda na estrutura do banco é o Flyway, não o Hibernate!
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true